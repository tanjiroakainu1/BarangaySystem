<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Admin Profile</h1>
    <p class="page-subtitle">Manage your account information and password</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="card">
      <h2 class="text-xl font-semibold text-gray-900 mb-6">Account Information</h2>
      <form class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
            <input type="text" class="input-field" [(ngModel)]="adminProfile.firstName" name="firstName" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Middle Name</label>
            <input type="text" class="input-field" [(ngModel)]="adminProfile.middleName" name="middleName" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
            <input type="text" class="input-field" [(ngModel)]="adminProfile.lastName" name="lastName" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" class="input-field bg-gray-50" [(ngModel)]="adminProfile.email" name="email" readonly />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
            <input type="tel" class="input-field" [(ngModel)]="adminProfile.phone" name="phone" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
          <textarea class="input-field resize-none" rows="2" [(ngModel)]="adminProfile.address" name="address"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Position</label>
            <input type="text" class="input-field" [(ngModel)]="adminProfile.position" name="position" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
            <input type="text" class="input-field" [(ngModel)]="adminProfile.department" name="department" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Employee ID</label>
            <input type="text" class="input-field bg-gray-50" [(ngModel)]="adminProfile.employeeId" name="employeeId" readonly />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Hire Date</label>
            <input type="date" class="input-field bg-gray-50" [(ngModel)]="adminProfile.hireDate" name="hireDate" readonly />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
          <input type="text" class="input-field bg-gray-50 capitalize" [(ngModel)]="adminProfile.role" name="role" readonly />
        </div>

        <div class="flex items-center gap-4">
          <button type="button" (click)="updateProfile()" class="btn-primary" [disabled]="isSaving">
            {{ isSaving ? 'Saving...' : 'Update Profile' }}
          </button>
          <p *ngIf="message" class="text-sm text-primary-700">{{ message }}</p>
        </div>
      </form>
    </div>

    <div class="card">
      <h2 class="text-xl font-semibold text-gray-900 mb-6">Change Password</h2>
      <app-change-password [passwordChangedAt]="passwordChangedAt"></app-change-password>
    </div>
  </div>
</div>
