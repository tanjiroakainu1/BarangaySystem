<div class="space-y-4">
  <div class="rounded-lg bg-gray-50 border border-gray-200 p-4 text-sm text-gray-600">
    <p class="font-medium text-gray-800 mb-1">Password security</p>
    <ul class="list-disc list-inside space-y-1">
      <li>Minimum 6 characters</li>
      <li>Use a mix of letters and numbers for stronger security</li>
      <li>Password is stored securely in Supabase Auth</li>
    </ul>
    <p class="mt-3 text-xs text-gray-500">
      Last changed: <span class="font-medium text-gray-700">{{ formatDate(passwordChangedAt) }}</span>
    </p>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
    <input type="password" class="input-field" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
    <input type="password" class="input-field" [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
    <input type="password" class="input-field" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" />
  </div>

  <div *ngIf="message" class="p-3 rounded-lg text-sm"
    [class.bg-green-50]="!isError" [class.text-green-800]="!isError"
    [class.bg-red-50]="isError" [class.text-red-800]="isError">
    {{ message }}
  </div>

  <div class="flex justify-end">
    <button type="button" class="btn-primary" (click)="changePassword()" [disabled]="isChanging">
      {{ isChanging ? 'Changing...' : 'Change Password' }}
    </button>
  </div>
</div>
