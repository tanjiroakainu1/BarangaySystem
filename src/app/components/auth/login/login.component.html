<div class="auth-shell">
  <div class="auth-card-wrap">
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 text-white shadow-btn-lg mb-4 mx-auto">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold gradient-text mb-2">Sign in to Barangay System</h2>
      <p class="text-sm sm:text-base text-gray-600">Residents, staff, and administrators use this portal</p>

      <div *ngIf="infoMessage" class="mt-4 bg-accent-50 border border-accent-200 text-accent-700 px-4 py-3 rounded-xl text-sm font-medium">
        {{ infoMessage }}
      </div>
    </div>

    <div class="mt-6 sm:mt-8">
    <div class="card shadow-lg border-0 ring-1 ring-gray-100">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
            Email address
          </label>
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            class="input-field"
            [class.border-red-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            placeholder="Enter your email"
          />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
            Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            formControlName="password"
            class="input-field"
            [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            placeholder="Enter your password"
          />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          </div>
        </div>

        <div class="flex flex-col xs:flex-row xs:items-center xs:justify-between gap-3">
          <div class="flex items-center">
            <input
              id="remember-me"
              name="remember-me"
              type="checkbox"
              class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded"
            />
            <label for="remember-me" class="ml-2 block text-sm text-gray-900 font-medium">
              Remember me
            </label>
          </div>

          <div class="text-sm">
            <a href="#" class="btn-link text-sm">Forgot your password?</a>
          </div>
        </div>

        <div *ngIf="errorMessage" class="bg-danger-50 border border-danger-100 text-danger-700 px-4 py-3 rounded-xl text-sm font-medium">
          {{ errorMessage }}
        </div>

        <div>
          <button
            type="submit"
            [disabled]="isLoading"
            class="btn-auth disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isLoading" class="flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
              </svg>
              Sign in
            </span>
            <span *ngIf="isLoading" class="flex items-center justify-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Signing in...
            </span>
          </button>
        </div>

        <div class="text-center mt-4">
          <span class="text-sm text-gray-600">
            Don't have an account?
            <button type="button" (click)="navigateToRegister()" class="btn-link text-sm ml-1">
              Sign up here
            </button>
          </span>
        </div>
      </form>
    </div>

    <div class="mt-6 text-center">
      <button type="button" (click)="navigateToHome()" class="btn-ghost btn-sm">
        ← Back to Home
      </button>
    </div>
  </div>
  </div>
</div>
