<nav class="navbar" *ngIf="shouldShowNavbar">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center">
        <div class="flex-shrink-0">
          <h1 class="text-xl font-bold gradient-text cursor-pointer" (click)="navigateToHome()">
            Barangay Online Appointment Certificate Management System
          </h1>
        </div>
        <div class="hidden md:block">
          <div class="ml-10 flex items-baseline space-x-4">
            <a href="#" class="text-gray-700 hover:text-emerald-600 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
              About
            </a>
            <a href="#" class="text-gray-700 hover:text-emerald-600 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
              Services
            </a>
            <a href="#" class="text-gray-700 hover:text-emerald-600 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
              Contact
            </a>
          </div>
        </div>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- Not logged in -->
        <div *ngIf="!currentUser" class="flex items-center space-x-4">
          <button 
            class="btn-outline text-sm"
            (click)="navigateToLogin()">
            Login
          </button>
          <button 
            class="btn-primary text-sm"
            (click)="navigateToRegister()">
            Register
          </button>
        </div>
        
        <!-- Logged in -->
        <div *ngIf="currentUser" class="flex items-center space-x-4">
          <span class="text-sm text-gray-700">
            Welcome, {{ getDisplayName() }}
          </span>
          <button 
            class="btn-outline text-sm"
            (click)="navigateToDashboard()">
            Dashboard
          </button>
          <button 
            class="text-gray-500 hover:text-gray-700 text-sm"
            (click)="logout()">
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
